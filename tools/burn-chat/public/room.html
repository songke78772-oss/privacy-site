<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Burn Chat Room - ToolNest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
  <div class="bg-white border-b px-4 py-4">
    <h1 class="text-2xl font-bold text-blue-600">Burn Chat</h1>
    <p class="text-gray-600 text-sm mt-1">Temporary group chat. Messages disappear when the room ends.</p>
  </div>

  <header class="bg-white border-b px-4 py-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex flex-col gap-1">
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-500">Owner:</span>
        <span id="ownerName" class="font-semibold text-blue-600">...</span>
        <span id="timer" class="text-sm text-gray-500 font-mono">--:--:--</span>
      </div>
      <div id="participants" class="flex flex-wrap gap-2 text-sm"></div>
    </div>
    <button id="dissolveBtn" class="hidden bg-red-600 text-white text-sm px-3 py-1.5 rounded hover:bg-red-700 self-start sm:self-auto">
      Dissolve Room
    </button>
  </header>

  <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-2"></div>

  <footer class="bg-white border-t p-3">
    <form id="msgForm" class="flex gap-2 max-w-4xl mx-auto">
      <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off"
             class="flex-1 border rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">Send</button>
    </form>
  </footer>

  <script>
    const params = new URLSearchParams(location.search);
    const pathParts = location.pathname.split('/');
    const roomId = pathParts[pathParts.length - 1];
    const isCreator = params.get('creator') === '1';
    const creatorName = params.get('name') || '';

    const socket = io({ path: '/burn-chat/socket.io' });

    const messagesEl = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const ownerNameEl = document.getElementById('ownerName');
    const timerEl = document.getElementById('timer');
    const dissolveBtn = document.getElementById('dissolveBtn');
    const participantsEl = document.getElementById('participants');

    let expireAt = 0;
    let maxPeople = 2;
    let slots = [];
    const colors = ['#16a34a', '#dc2626', '#9333ea', '#ea580c', '#0891b2', '#be185d', '#4f46e5', '#0d9488'];

    function renderParticipants() {
      participantsEl.innerHTML = '';
      slots.forEach(slot => {
        const span = document.createElement('span');
        span.className = 'px-2 py-0.5 rounded text-xs font-medium';
        if (slot.joined) {
          span.style.background = slot.color + '22';
          span.style.color = slot.color;
          span.textContent = slot.label;
        } else {
          span.className += ' bg-gray-100 text-gray-400';
          span.textContent = slot.label;
        }
        participantsEl.appendChild(span);
      });
    }

    function initSlots(owner) {
      slots = [{ label: owner, joined: true, color: '#1d4ed8' }];
      for (let i = 1; i < maxPeople; i++) {
        slots.push({ label: `Guest ${i}`, joined: false, color: colors[(i - 1) % colors.length] });
      }
      renderParticipants();
    }

    function addSystem(text) {
      const div = document.createElement('div');
      div.className = 'text-center text-xs text-gray-500 py-1';
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(name, text) {
      const div = document.createElement('div');
      div.className = 'bg-white rounded-lg px-3 py-2 text-sm shadow-sm max-w-xl';
      div.innerHTML = `<span class="font-medium text-blue-600">${name}:</span> <span class="text-gray-800">${text}</span>`;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function updateTimer() {
      if (!expireAt) return;
      const left = Math.max(0, expireAt - Date.now());
      const h = Math.floor(left / 3600000);
      const m = Math.floor((left % 3600000) / 60000);
      const s = Math.floor((left % 60000) / 1000);
      timerEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if (left <= 0) {
        addSystem('Room has expired.');
        msgInput.disabled = true;
      }
    }
    setInterval(updateTimer, 1000);

    socket.on('connect', () => {
      socket.emit('join-room', { roomId, isCreator, name: creatorName });
    });

    socket.on('joined', ({ name, expireAt: exp, maxPeople: mp, creatorName: cName, isCreator: ic }) => {
      expireAt = exp;
      maxPeople = mp || 2;
      const owner = cName || creatorName || 'Owner';
      ownerNameEl.textContent = owner;
      initSlots(owner);

      if (!ic && name && name !== owner) {
        const empty = slots.find(s => !s.joined && s.label.startsWith('Guest'));
        if (empty) {
          empty.label = name;
          empty.joined = true;
        }
      }

      if (ic) dissolveBtn.classList.remove('hidden');
      renderParticipants();
      updateTimer();
    });

    socket.on('history', (msgs) => {
      msgs.forEach(m => addMessage(m.name, m.ciphertext || ''));
    });

    socket.on('message', (m) => addMessage(m.name, m.ciphertext || ''));

    socket.on('system', (text) => {
      addSystem(text);
      const joinMatch = text.match(/^(.+) has joined the room$/);
      if (joinMatch) {
        const joinedName = joinMatch[1];
        const empty = slots.find(s => !s.joined && s.label.startsWith('Guest'));
        if (empty && joinedName !== ownerNameEl.textContent) {
          empty.label = joinedName;
          empty.joined = true;
          renderParticipants();
        }
      }
    });

    socket.on('error', (err) => addSystem('Error: ' + err));

    document.getElementById('msgForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;
      socket.emit('message', { roomId, ciphertext: text });
      msgInput.value = '';
    });

    dissolveBtn.addEventListener('click', () => {
      if (confirm('Dissolve this room? All messages will be permanently deleted.')) {
        socket.emit('dissolve', { roomId });
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Burn Chat Room - ToolNest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="bg-gray-50 h-screen flex flex-col">
  <div class="bg-white border-b px-4 py-4">
    <h1 class="text-2xl font-bold text-blue-600">Burn Chat</h1>
    <p class="text-gray-600 text-sm mt-1">Temporary group chat. Messages disappear when the room ends.</p>
  </div>

  <header class="bg-white border-b px-4 py-3 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
    <div class="flex flex-col gap-1">
      <div class="flex items-center gap-3">
        <span class="text-sm text-gray-500">Owner:</span>
        <span id="ownerName" class="font-semibold text-blue-600">...</span>
        <span id="timer" class="text-sm text-gray-500 font-mono">--:--:--</span>
      </div>
      <div id="participants" class="flex flex-wrap gap-2 text-sm"></div>
    </div>
    <div class="flex gap-2">
      <button id="whiteboardBtn" class="bg-gray-600 text-white text-sm px-3 py-1.5 rounded hover:bg-gray-700">Whiteboard</button>
      <button id="dissolveBtn" class="hidden bg-red-600 text-white text-sm px-3 py-1.5 rounded hover:bg-red-700">Dissolve Room</button>
    </div>
  </header>

  <div id="messages" class="flex-1 overflow-y-auto p-4 space-y-3"></div>

  <footer class="bg-white border-t p-3">
    <form id="msgForm" class="flex gap-2 max-w-4xl mx-auto">
      <input id="msgInput" type="text" placeholder="Type a message..." autocomplete="off"
             class="flex-1 border rounded px-3 py-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
      <label class="bg-gray-200 hover:bg-gray-300 px-3 py-2 rounded text-sm cursor-pointer">
        Image
        <input type="file" id="imageInput" accept="image/*" class="hidden">
      </label>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm hover:bg-blue-700">Send</button>
    </form>
  </footer>

  <!-- Whiteboard Modal -->
  <div id="whiteboardModal" class="hidden fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-xl w-full max-w-4xl h-[80vh] flex flex-col">
      <div class="flex justify-between items-center p-4 border-b">
        <h2 class="font-bold">Shared Whiteboard</h2>
        <button id="closeWhiteboard" class="text-gray-500 hover:text-gray-800">✕</button>
      </div>
      <canvas id="whiteboard" class="flex-1 bg-white border-t cursor-crosshair"></canvas>
      <div class="p-3 border-t flex gap-2">
        <button id="clearBoard" class="bg-red-100 text-red-600 px-3 py-1 rounded text-sm">Clear</button>
        <span class="text-xs text-gray-500 self-center">Draw with mouse / touch. Changes are shared in real time.</span>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const pathParts = location.pathname.split('/');
    const roomId = pathParts[pathParts.length - 1];
    const isCreator = params.get('creator') === '1';
    const creatorName = params.get('name') || '';

    const socket = io({ path: '/burn-chat/socket.io' });

    const messagesEl = document.getElementById('messages');
    const msgInput = document.getElementById('msgInput');
    const ownerNameEl = document.getElementById('ownerName');
    const timerEl = document.getElementById('timer');
    const dissolveBtn = document.getElementById('dissolveBtn');
    const participantsEl = document.getElementById('participants');
    const imageInput = document.getElementById('imageInput');
    const whiteboardBtn = document.getElementById('whiteboardBtn');
    const whiteboardModal = document.getElementById('whiteboardModal');
    const closeWhiteboard = document.getElementById('closeWhiteboard');
    const canvas = document.getElementById('whiteboard');
    const clearBoard = document.getElementById('clearBoard');

    let expireAt = 0;
    let maxPeople = 2;
    let slots = [];
    let myName = '';
    const colors = ['#16a34a', '#dc2626', '#9333ea', '#ea580c', '#0891b2', '#be185d', '#4f46e5', '#0d9488'];

    // Whiteboard
    const ctx = canvas.getContext('2d');
    let drawing = false;
    let lastX = 0, lastY = 0;

    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    window.addEventListener('resize', resizeCanvas);

    function getNameColor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
      const palette = ['#2563eb', '#dc2626', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#be185d', '#0d9488'];
      return palette[Math.abs(hash) % palette.length];
    }

    function renderParticipants() {
      participantsEl.innerHTML = '';
      slots.forEach(slot => {
        const span = document.createElement('span');
        span.className = 'px-2 py-0.5 rounded text-xs font-medium';
        if (slot.joined) {
          span.style.background = slot.color + '22';
          span.style.color = slot.color;
          span.textContent = slot.label;
        } else {
          span.className += ' bg-gray-100 text-gray-400';
          span.textContent = slot.label;
        }
        participantsEl.appendChild(span);
      });
    }

    function initSlots(owner) {
      slots = [{ label: owner, joined: true, color: '#1d4ed8' }];
      for (let i = 1; i < maxPeople; i++) {
        slots.push({ label: `Guest ${i}`, joined: false, color: colors[(i - 1) % colors.length] });
      }
      renderParticipants();
    }

    function addSystem(text) {
      const div = document.createElement('div');
      div.className = 'text-center text-xs text-gray-500 py-1';
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addMessage(name, text, isMine = false, isImage = false) {
      const wrapper = document.createElement('div');
      wrapper.className = 'flex ' + (isMine ? 'justify-end' : 'justify-start');

      const bubble = document.createElement('div');
      bubble.className = 'max-w-[75%] sm:max-w-md rounded-2xl px-4 py-2 text-sm shadow-sm ' +
        (isMine ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border');

      const nameEl = document.createElement('div');
      nameEl.className = 'text-xs font-medium mb-1';
      nameEl.style.color = isMine ? 'rgba(255,255,255,0.85)' : getNameColor(name);
      nameEl.textContent = name;

      bubble.appendChild(nameEl);

      if (isImage) {
        const img = document.createElement('img');
        img.src = text;
        img.className = 'max-w-full rounded-lg mt-1';
        img.style.maxHeight = '200px';
        bubble.appendChild(img);
      } else {
        const textEl = document.createElement('div');
        textEl.className = 'break-words';
        textEl.textContent = text;
        bubble.appendChild(textEl);
      }

      wrapper.appendChild(bubble);
      messagesEl.appendChild(wrapper);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function updateTimer() {
      if (!expireAt) return;
      const left = Math.max(0, expireAt - Date.now());
      const h = Math.floor(left / 3600000);
      const m = Math.floor((left % 3600000) / 60000);
      const s = Math.floor((left % 60000) / 1000);
      timerEl.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
      if (left <= 0) {
        addSystem('Room has expired.');
        msgInput.disabled = true;
      }
    }
    setInterval(updateTimer, 1000);

    // Whiteboard drawing
    function startDraw(e) {
      drawing = true;
      const rect = canvas.getBoundingClientRect();
      lastX = (e.clientX || e.touches[0].clientX) - rect.left;
      lastY = (e.clientY || e.touches[0].clientY) - rect.top;
    }
    function draw(e) {
      if (!drawing) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const x = (e.clientX || e.touches[0].clientX) - rect.left;
      const y = (e.clientY || e.touches[0].clientY) - rect.top;

      ctx.beginPath();
      ctx.moveTo(lastX, lastY);
      ctx.lineTo(x, y);
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.stroke();

      socket.emit('whiteboard-draw', { roomId, fromX: lastX, fromY: lastY, toX: x, toY: y });
      lastX = x;
      lastY = y;
    }
    function stopDraw() { drawing = false; }

    canvas.addEventListener('mousedown', startDraw);
    canvas.addEventListener('mousemove', draw);
    canvas.addEventListener('mouseup', stopDraw);
    canvas.addEventListener('mouseout', stopDraw);
    canvas.addEventListener('touchstart', startDraw);
    canvas.addEventListener('touchmove', draw);
    canvas.addEventListener('touchend', stopDraw);

    whiteboardBtn.addEventListener('click', () => {
      whiteboardModal.classList.remove('hidden');
      setTimeout(resizeCanvas, 50);
    });
    closeWhiteboard.addEventListener('click', () => whiteboardModal.classList.add('hidden'));
    clearBoard.addEventListener('click', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      socket.emit('whiteboard-clear', { roomId });
    });

    // Image upload
    imageInput.addEventListener('change', () => {
      const file = imageInput.files[0];
      if (!file) return;
      if (file.size > 500 * 1024) {
        alert('Image must be under 500KB');
        return;
      }
      const reader = new FileReader();
      reader.onload = () => {
        socket.emit('message', { roomId, ciphertext: reader.result, isImage: true });
      };
      reader.readAsDataURL(file);
      imageInput.value = '';
    });

    socket.on('connect', () => {
      socket.emit('join-room', { roomId, isCreator, name: creatorName });
    });

    socket.on('joined', ({ name, expireAt: exp, maxPeople: mp, creatorName: cName, isCreator: ic }) => {
      myName = name;
      expireAt = exp;
      maxPeople = mp || 2;
      const owner = cName || creatorName || 'Owner';
      ownerNameEl.textContent = owner;
      initSlots(owner);

      if (!ic && name && name !== owner) {
        const empty = slots.find(s => !s.joined && s.label.startsWith('Guest'));
        if (empty) {
          empty.label = name;
          empty.joined = true;
        }
      }

      if (ic) dissolveBtn.classList.remove('hidden');
      renderParticipants();
      updateTimer();
    });

    socket.on('history', (msgs) => {
      msgs.forEach(m => addMessage(m.name, m.ciphertext || '', m.name === myName, m.isImage));
    });

    socket.on('message', (m) => {
      addMessage(m.name, m.ciphertext || '', m.name === myName, m.isImage);
    });

    socket.on('whiteboard-draw', ({ fromX, fromY, toX, toY }) => {
      ctx.beginPath();
      ctx.moveTo(fromX, fromY);
      ctx.lineTo(toX, toY);
      ctx.strokeStyle = '#2563eb';
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.stroke();
    });

    socket.on('whiteboard-clear', () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    });

    socket.on('system', (text) => {
      addSystem(text);
      const joinMatch = text.match(/^(.+) has joined the room$/);
      if (joinMatch) {
        const joinedName = joinMatch[1];
        const empty = slots.find(s => !s.joined && s.label.startsWith('Guest'));
        if (empty && joinedName !== ownerNameEl.textContent) {
          empty.label = joinedName;
          empty.joined = true;
          renderParticipants();
        }
      }
    });

    socket.on('error', (err) => addSystem('Error: ' + err));

    document.getElementById('msgForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const text = msgInput.value.trim();
      if (!text) return;
      socket.emit('message', { roomId, ciphertext: text, isImage: false });
      msgInput.value = '';
    });

    dissolveBtn.addEventListener('click', () => {
      if (confirm('Dissolve this room? All messages will be permanently deleted.')) {
        socket.emit('dissolve', { roomId });
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Create Burn Chat - ToolNest</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <div class="max-w-xl mx-auto py-8 px-4">
    <h1 class="text-2xl font-bold text-blue-600">Burn Chat</h1>
    <p class="text-gray-600 text-sm mt-1">Temporary group chat. Messages disappear when the room ends.</p>

    <div class="mt-4 bg-red-50 border border-red-100 text-red-600 text-sm rounded-lg px-4 py-3">
      <strong>100% Temporary</strong><br>
      All messages are deleted when the room expires or is dissolved. Nothing is stored permanently.
    </div>

    <form id="createForm" class="bg-white rounded-xl shadow p-6 mt-6 space-y-4">
      <div>
        <label class="block text-sm font-medium mb-1">Max People</label>
        <select id="maxPeople" class="w-full border rounded px-3 py-2">
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
          <option value="6">6</option>
          <option value="7">7</option>
          <option value="8">8</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Duration</label>
        <select id="hours" class="w-full border rounded px-3 py-2">
          <option value="1">1 hour</option>
          <option value="2">2 hours</option>
          <option value="4">4 hours</option>
          <option value="8">8 hours</option>
          <option value="12">12 hours</option>
          <option value="24">24 hours</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Name Category</label>
        <select id="category" class="w-full border rounded px-3 py-2">
          <option value="animal">Animals</option>
          <option value="fruit">Fruits</option>
          <option value="vegetable">Vegetables</option>
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Your Name</label>
        <select id="creatorName" class="w-full border rounded px-3 py-2"></select>
      </div>

      <div>
        <label class="block text-sm font-medium mb-1">Password (optional)</label>
        <input type="text" id="password" placeholder="Leave empty for no password" class="w-full border rounded px-3 py-2">
      </div>

      <div class="flex items-center gap-2">
        <input type="checkbox" id="deepEncrypt" class="rounded">
        <label for="deepEncrypt" class="text-sm">Deep encrypt (client-side encryption)</label>
      </div>

      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700">
        Create Room
      </button>
    </form>

    <div id="result" class="hidden mt-6 bg-white rounded-xl shadow p-6"></div>
    <div id="error" class="hidden mt-4 text-red-600 text-sm"></div>
  </div>

  <script>
    const namePools = {
      animal: ['Lion', 'Tiger', 'Bear', 'Wolf', 'Fox', 'Deer', 'Eagle', 'Owl', 'Rabbit', 'Panda', 'Koala', 'Dolphin'],
      fruit: ['Apple', 'Banana', 'Orange', 'Grape', 'Mango', 'Peach', 'Cherry', 'Lemon', 'Kiwi', 'Melon', 'Pear', 'Plum'],
      vegetable: ['Carrot', 'Potato', 'Tomato', 'Onion', 'Cabbage', 'Broccoli', 'Spinach', 'Pepper', 'Corn', 'Bean', 'Pea', 'Radish']
    };

    const categorySelect = document.getElementById('category');
    const nameSelect = document.getElementById('creatorName');

    function updateNames() {
      const cat = categorySelect.value;
      const names = namePools[cat] || [];
      nameSelect.innerHTML = '';
      names.forEach(n => {
        const opt = document.createElement('option');
        opt.value = n;
        opt.textContent = n;
        nameSelect.appendChild(opt);
      });
    }

    categorySelect.addEventListener('change', updateNames);
    updateNames();

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorEl = document.getElementById('error');
      const resultEl = document.getElementById('result');
      errorEl.classList.add('hidden');
      resultEl.classList.add('hidden');

      const data = {
        maxPeople: Number(document.getElementById('maxPeople').value),
        hours: Number(document.getElementById('hours').value),
        category: categorySelect.value,
        creatorName: nameSelect.value,
        deepEncrypt: document.getElementById('deepEncrypt').checked,
        password: document.getElementById('password').value || ''
      };

      try {
        const res = await fetch('/burn-chat/api/create-room', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await res.json();

        if (!res.ok || result.error) {
          errorEl.textContent = result.error || 'Failed to create room';
          errorEl.classList.remove('hidden');
          return;
        }

        const links = (result.inviteLinks || []).map(l => 
          `<div class="flex gap-2 mb-2">
            <input readonly value="${location.origin}${l.url}" class="flex-1 border rounded px-2 py-1 text-sm bg-gray-50">
            <button type="button" onclick="navigator.clipboard.writeText(this.previousElementSibling.value);this.textContent='Copied!'" class="text-sm bg-gray-200 px-3 py-1 rounded">Copy</button>
          </div>`
        ).join('');
        resultEl.innerHTML = `<p class="font-medium mb-2">Room created. Share the links below:</p>${links}`;
        resultEl.classList.remove('hidden');
      } catch (err) {
        errorEl.textContent = 'Network error';
        errorEl.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>

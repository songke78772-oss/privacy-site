<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>EmberLink</title>
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  <style>
    body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 0 20px; }
    #editor { height: 300px; margin-bottom: 20px; }
    .options { margin: 15px 0; }
    button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; }
    .result { margin-top: 20px; padding: 15px; background: #f3f4f6; border-radius: 8px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>EmberLink</h1>
  <p>Share a message that can only be viewed once. Encrypted in your browser.</p>

  <div id="editor"></div>

  <div class="options">
    <label>Password (optional): <input type="password" id="password"></label><br><br>
    <label>Expires in:
      <select id="expires">
        <option value="1">1 hour</option>
        <option value="24" selected>24 hours</option>
        <option value="168">7 days</option>
        <option value="0">Never</option>
      </select>
    </label><br><br>
    <label>Max views:
      <select id="maxViews">
        <option value="1" selected>1 (burn after reading)</option>
        <option value="3">3</option>
        <option value="5">5</option>
      </select>
    </label>
  </div>

  <button onclick="createLink()">Create Link</button>

  <div id="result" class="result" style="display:none;"></div>

  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script>
    const quill = new Quill('#editor', {
      theme: 'snow',
      modules: {
        toolbar: [
          ['bold', 'italic', 'underline'],
          ['link', 'image'],
          [{ list: 'ordered' }, { list: 'bullet' }],
          ['clean']
        ]
      },
      placeholder: 'Please enter your content; it will not be lost if you refresh the page...'
    });

    // 限制图片大小 500KB
    quill.getModule('toolbar').addHandler('image', () => {
      const input = document.createElement('input');
      input.setAttribute('type', 'file');
      input.setAttribute('accept', 'image/*');
      input.click();
      input.onchange = () => {
        const file = input.files[0];
        if (file.size > 500 * 1024) {
          alert('Image must be smaller than 500KB');
          return;
        }
        const reader = new FileReader();
        reader.onload = (e) => {
          const range = quill.getSelection();
          quill.insertEmbed(range.index, 'image', e.target.result);
        };
        reader.readAsDataURL(file);
      };
    });

    async function createLink() {
      const html = quill.root.innerHTML;
      if (!html || html === '<p><br></p>') return alert('Please enter content');

      const password = document.getElementById('password').value;
      const expiresInHours = parseInt(document.getElementById('expires').value) || null;
      const maxViews = parseInt(document.getElementById('maxViews').value);

      // 生成密钥
      const key = await crypto.subtle.generateKey({ name: 'AES-GCM', length: 256 }, true, ['encrypt']);
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encoded = new TextEncoder().encode(html);

      let salt = null;
      let finalKey = key;
      if (password) {
        salt = crypto.getRandomValues(new Uint8Array(16));
        const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
        const derived = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, keyMaterial, 256);
        finalKey = await crypto.subtle.importKey('raw', derived, 'AES-GCM', false, ['encrypt']);
      }

      const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, finalKey, encoded);
      const ctBase64 = btoa(String.fromCharCode(...new Uint8Array(ciphertext)));
      const ivBase64 = btoa(String.fromCharCode(...iv));
      const saltBase64 = salt ? btoa(String.fromCharCode(...salt)) : null;

      const res = await fetch('/api/create', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          ciphertext: ctBase64,
          iv: ivBase64,
          salt: saltBase64,
          hasPassword: !!password,
          expiresInHours,
          maxViews
        })
      });
      const data = await res.json();

      // 密钥放在 # 后面
      const keyRaw = await crypto.subtle.exportKey('raw', key);
      const keyBase64 = btoa(String.fromCharCode(...new Uint8Array(keyRaw)));
      const link = `${location.origin}/emberlink/view.html?id=${data.id}#${keyBase64}`;

      document.getElementById('result').style.display = 'block';
      document.getElementById('result').innerHTML = `<strong>Link created:</strong><br><a href="${link}" target="_blank">${link}</a>`;
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmberLink</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="max-w-lg mx-auto px-4 py-12">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-2xl font-bold text-gray-800">EmberLink</h1>
      <select id="lang-switcher" class="border rounded px-2 py-1 text-sm">
        <option value="en">English</option>
        <option value="zh">中文</option>
        <option value="es">Español</option>
        <option value="ja">日本語</option>
        <option value="ko">한국어</option>
        <option value="ar">العربية</option>
      </select>
    </div>

    <div class="bg-white border rounded-xl p-6">
      <p class="text-gray-600 text-sm mb-6" data-i18n="ember_desc">Share a message that self-destructs after reading.</p>

      <div class="mb-4">
        <label class="block text-sm text-gray-700 mb-1" data-i18n="ember_message">Message</label>
        <textarea id="message" rows="6" class="w-full border rounded px-3 py-2 text-sm" placeholder="Enter your message..."></textarea>
      </div>

      <div class="mb-6">
        <label class="block text-sm text-gray-700 mb-1" data-i18n="ember_expire">Expire after</label>
        <div class="flex items-center gap-2">
          <input type="number" id="hours" value="24" min="1" max="168" class="border rounded px-3 py-2 w-24 text-sm">
          <span class="text-sm text-gray-600" data-i18n="ember_hours">hours</span>
        </div>
      </div>

      <button id="generate" class="w-full bg-blue-600 text-white py-2.5 rounded hover:bg-blue-700 text-sm font-medium" data-i18n="ember_generate">Generate Link</button>

      <div id="result" class="mt-6 hidden">
        <label class="block text-sm text-gray-700 mb-1">Link</label>
        <div class="flex gap-2">
          <input id="link" readonly class="flex-1 border rounded px-3 py-2 text-sm bg-gray-50">
          <button id="copy" class="bg-gray-800 text-white px-4 py-2 rounded text-sm">Copy</button>
        </div>
        <p class="text-xs text-gray-500 mt-2" data-i18n="ember_warning">This link will self-destruct after being read or when it expires.</p>
      </div>
    </div>
  </div>

  <script src="/js/i18n.js"></script>
  <script>
    // 保留你原来的生成逻辑，这里只放多语言相关
    document.getElementById('generate')?.addEventListener('click', async () => {
      // 你原来的生成代码放这里
    });
  </script>
</body>
</html>

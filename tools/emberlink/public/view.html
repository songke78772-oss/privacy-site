<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>EmberLink</title>
  <style>
    body { 
      font-family: system-ui, -apple-system, sans-serif; 
      max-width: 800px; 
      margin: 40px auto; 
      padding: 0 20px; 
      color: #1e293b;
    }
    h1 { color: #2563eb; }
    .privacy-banner {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 14px 16px;
      margin: 20px 0;
      font-size: 14px;
      line-height: 1.6;
    }
    .privacy-banner strong {
      color: #dc2626;
      font-weight: 700;
    }
    .content { 
      border: 1px solid #ddd; 
      padding: 20px; 
      border-radius: 8px; 
      margin-top: 16px;
    }
    .burned-notice {
      color: #666;
      margin-top: 20px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>EmberLink</h1>
  
  <div class="privacy-banner">
    <strong>100% Client-side Encrypted</strong><br>
    <strong>The server only stores ciphertext and cannot read the content</strong>
  </div>

  <div id="content">Loading...</div>

  <script>
    async function load() {
      const params = new URLSearchParams(location.search);
      const id = params.get('id');
      const keyBase64 = location.hash.slice(1);
      if (!id || !keyBase64) return document.getElementById('content').textContent = 'Invalid link';

      const res = await fetch(`/emberlink/api/read/${id}`, { method: 'POST' });
      const data = await res.json();
      if (data.error) return document.getElementById('content').textContent = data.error;

      if (data.preview) {
        document.getElementById('content').innerHTML = '<p style="color:#64748b;">Link preview is disabled for privacy.</p>';
        return;
      }

      let password = '';
      if (data.hasPassword) {
        password = prompt('Enter password:');
        if (!password) return;
      }

      try {
        const keyRaw = Uint8Array.from(atob(keyBase64), c => c.charCodeAt(0));
        let key = await crypto.subtle.importKey('raw', keyRaw, 'AES-GCM', false, ['decrypt']);

        if (data.hasPassword && data.salt) {
          const salt = Uint8Array.from(atob(data.salt), c => c.charCodeAt(0));
          const keyMaterial = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
          const derived = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' }, keyMaterial, 256);
          key = await crypto.subtle.importKey('raw', derived, 'AES-GCM', false, ['decrypt']);
        }

        const iv = Uint8Array.from(atob(data.iv), c => c.charCodeAt(0));
        const ct = Uint8Array.from(atob(data.ciphertext), c => c.charCodeAt(0));
        const decrypted = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
        const html = new TextDecoder().decode(decrypted);

        document.getElementById('content').innerHTML = `
          <div class="content">${html}</div>
          <p class="burned-notice">This message has been burned.</p>
        `;
      } catch (e) {
        document.getElementById('content').textContent = 'Decryption failed (wrong password or corrupted)';
      }
    }
    load();
  </script>
</body>
</html>
